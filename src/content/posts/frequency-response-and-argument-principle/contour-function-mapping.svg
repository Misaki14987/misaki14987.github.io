<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">闭合边界经过函数映射</title>
  <desc id="desc">s 平面中的右半圆闭合边界经过 F(s)=1+2s 映射后，在 F 平面中仍然形成闭合轨迹。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2f5bd3"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#28775f"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#fbfbfa"/>
  <g fill="#fff" stroke="#b1b5bd" stroke-width="1.5">
    <rect x="45" y="65" width="365" height="340"/>
    <rect x="590" y="65" width="365" height="340"/>
  </g>
  <g fill="none" stroke="#7b8190" stroke-width="1.5">
    <line x1="75" y1="235" x2="382" y2="235"/>
    <line x1="195" y1="88" x2="195" y2="382"/>
    <line x1="620" y1="235" x2="925" y2="235"/>
    <line x1="690" y1="88" x2="690" y2="382"/>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#20242d">
    <text x="227" y="39" text-anchor="middle" font-size="20" font-weight="600">s 平面：代入的位置</text>
    <text x="772" y="39" text-anchor="middle" font-size="20" font-weight="600">F 平面：算出的结果</text>
    <text x="376" y="218" text-anchor="end" fill="#666d7b">σ</text>
    <text x="210" y="105" fill="#666d7b">jω</text>
    <text x="920" y="218" text-anchor="end" fill="#666d7b">Re F</text>
    <text x="706" y="105" fill="#666d7b">Im F</text>
  </g>
  <path d="M195 105L195 365A130 130 0 0 0 195 105" fill="#e8efff" stroke="#2f5bd3" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <g fill="#2f5bd3">
    <circle cx="195" cy="105" r="6"/>
    <circle cx="325" cy="235" r="6"/>
    <circle cx="195" cy="365" r="6"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#20242d" font-weight="600">
    <text x="180" y="98" text-anchor="end">s = j</text>
    <text x="337" y="227">s = 1</text>
    <text x="180" y="382" text-anchor="end">s = −j</text>
    <text x="290" y="348" fill="#666d7b">Γ<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  </g>
  <g font-family="sans-serif" fill="#20242d" text-anchor="middle">
    <text x="500" y="208" font-size="20" font-weight="600">F(s) = 1 + 2s</text>
    <text x="500" y="239" font-size="28" fill="#28775f">→</text>
    <text x="500" y="272" font-size="15" fill="#666d7b">边界上的点逐个代入</text>
  </g>
  <path d="M755 105L755 365A130 130 0 0 0 755 105" fill="none" stroke="#28775f" stroke-width="4" marker-end="url(#arrow-green)"/>
  <g fill="#28775f">
    <circle cx="755" cy="105" r="6"/>
    <circle cx="885" cy="235" r="6"/>
    <circle cx="755" cy="365" r="6"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#20242d" font-weight="600">
    <text x="770" y="98">1 + 2j</text>
    <text x="875" y="224" text-anchor="end">3</text>
    <text x="770" y="383">1 − 2j</text>
    <text x="826" y="348" fill="#666d7b">F(Γ<tspan baseline-shift="sub" font-size="11">1</tspan>)</text>
  </g>
</svg>
