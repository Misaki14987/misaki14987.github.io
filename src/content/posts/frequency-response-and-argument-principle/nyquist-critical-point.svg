<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">反馈系统中的奈奎斯特临界点</title>
  <desc id="desc">左侧是 F(s) 轨迹绕原点，右侧是等价的 T(s) 轨迹绕临界点一，两个轨迹的绕圈数相同。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#3156d8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#28775f"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#f8f7f2"/>
  <g fill="#fff" stroke="#a4a6aa">
    <rect x="40" y="40" width="330" height="300"/>
    <rect x="530" y="40" width="330" height="300"/>
  </g>
  <g stroke="#777c89" fill="none">
    <line x1="62" y1="190" x2="348" y2="190"/>
    <line x1="205" y1="64" x2="205" y2="316"/>
    <line x1="552" y1="190" x2="838" y2="190"/>
    <line x1="595" y1="64" x2="595" y2="316"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#172033">
    <text x="55" y="66">F(s) 平面</text>
    <text x="545" y="66">T(s) 平面</text>
    <text x="342" y="183" text-anchor="end" fill="#485064">Re</text>
    <text x="212" y="78" fill="#485064">Im</text>
    <text x="832" y="183" text-anchor="end" fill="#485064">Re</text>
    <text x="602" y="78" fill="#485064">Im</text>
  </g>
  <path d="M300 190 C301 118 259 86 205 92 C142 98 112 143 121 205 C130 270 181 296 239 278 C285 264 309 226 300 190" fill="none" stroke="#3156d8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <circle cx="205" cy="190" r="6" fill="#d4535d"/>
  <g font-family="sans-serif" font-size="14">
    <text x="216" y="181" fill="#d4535d">原点 0</text>
    <text x="105" y="318" fill="#3156d8">F(s) 的轨迹绕原点</text>
  </g>
  <g transform="translate(450 174)" fill="#172033" font-family="sans-serif">
    <text text-anchor="middle" font-size="18">F(s)=1−T(s)</text>
    <path d="M-35 22H35" stroke="#172033" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
  <path d="M600 190 C599 262 641 294 695 288 C758 282 788 237 779 175 C770 110 719 84 661 102 C615 116 591 154 600 190" fill="none" stroke="#28775f" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="695" y1="184" x2="695" y2="196" stroke="#d4535d" stroke-width="3"/>
  <circle cx="695" cy="190" r="6" fill="#d4535d"/>
  <g font-family="sans-serif" font-size="14">
    <text x="706" y="181" fill="#d4535d">临界点 1</text>
    <text x="616" y="318" fill="#28775f">T(s) 的轨迹绕点 1</text>
  </g>
  <text x="450" y="377" text-anchor="middle" fill="#172033" font-family="sans-serif" font-size="15">两边的净绕圈数相同</text>
</svg>
