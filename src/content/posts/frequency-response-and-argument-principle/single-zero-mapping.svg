<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">零点在路径内部和外部时的映射</title>
  <desc id="desc">对于 F(s)=s-z0，零点在输入路径内部时映射轨迹包围原点，零点在路径外部时映射轨迹不包围原点。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2f5bd3"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#28775f"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#fbfbfa"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="600" fill="#20242d">F(s) = s − z₀</text>
  <line x1="500" y1="65" x2="500" y2="548" stroke="#c4c7cd" stroke-width="1.5"/>
  <g font-family="sans-serif" fill="#20242d">
    <text x="250" y="76" text-anchor="middle" font-size="19" font-weight="600">z₀ 在路径内部</text>
    <text x="750" y="76" text-anchor="middle" font-size="19" font-weight="600">z₀ 在路径外部</text>
  </g>

  <g transform="translate(30 102)">
    <text x="105" y="12" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#20242d">s 平面</text>
    <line x1="15" y1="125" x2="205" y2="125" stroke="#7b8190" stroke-width="1.4"/>
    <line x1="105" y1="28" x2="105" y2="222" stroke="#7b8190" stroke-width="1.4"/>
    <circle cx="105" cy="125" r="70" fill="none" stroke="#2f5bd3" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <circle cx="130" cy="103" r="6" fill="#d14f59"/>
    <text x="140" y="95" font-family="sans-serif" font-size="15" font-weight="600" fill="#20242d">z₀</text>
    <text x="156" y="192" font-family="sans-serif" font-size="15" fill="#666d7b">Γ</text>
  </g>
  <g transform="translate(265 102)">
    <text x="105" y="12" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#20242d">F 平面</text>
    <line x1="15" y1="125" x2="205" y2="125" stroke="#7b8190" stroke-width="1.4"/>
    <line x1="105" y1="28" x2="105" y2="222" stroke="#7b8190" stroke-width="1.4"/>
    <circle cx="80" cy="147" r="70" fill="none" stroke="#28775f" stroke-width="4" marker-end="url(#arrow-green)"/>
    <circle cx="105" cy="125" r="6" fill="#d14f59"/>
    <text x="115" y="116" font-family="sans-serif" font-size="15" font-weight="600" fill="#20242d">0</text>
    <text x="38" y="216" font-family="sans-serif" font-size="15" fill="#666d7b">F(Γ)</text>
  </g>
  <text x="250" y="366" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#28775f">向量转过所有方向，轨迹绕原点一圈</text>

  <g transform="translate(530 102)">
    <text x="105" y="12" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#20242d">s 平面</text>
    <line x1="15" y1="125" x2="220" y2="125" stroke="#7b8190" stroke-width="1.4"/>
    <line x1="105" y1="28" x2="105" y2="222" stroke="#7b8190" stroke-width="1.4"/>
    <circle cx="105" cy="125" r="70" fill="none" stroke="#2f5bd3" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <circle cx="205" cy="103" r="6" fill="#d14f59"/>
    <text x="195" y="92" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="600" fill="#20242d">z₀</text>
    <text x="156" y="192" font-family="sans-serif" font-size="15" fill="#666d7b">Γ</text>
  </g>
  <g transform="translate(765 102)">
    <text x="105" y="12" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#20242d">F 平面</text>
    <line x1="0" y1="125" x2="205" y2="125" stroke="#7b8190" stroke-width="1.4"/>
    <line x1="120" y1="28" x2="120" y2="222" stroke="#7b8190" stroke-width="1.4"/>
    <circle cx="20" cy="147" r="70" fill="none" stroke="#28775f" stroke-width="4" marker-end="url(#arrow-green)"/>
    <circle cx="120" cy="125" r="6" fill="#d14f59"/>
    <text x="130" y="116" font-family="sans-serif" font-size="15" font-weight="600" fill="#20242d">0</text>
    <text x="4" y="216" font-family="sans-serif" font-size="15" fill="#666d7b">F(Γ)</text>
  </g>
  <text x="750" y="366" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#666d7b">向量方向来回变化，轨迹不绕原点</text>

  <g font-family="sans-serif" font-size="16" fill="#20242d">
    <text x="250" y="430" text-anchor="middle">|z₀| ≈ 0.81 &lt; 2</text>
    <text x="250" y="460" text-anchor="middle" fill="#666d7b">零点在半径为 2 的路径内部</text>
    <text x="750" y="430" text-anchor="middle">|z₀| ≈ 3.03 &gt; 2</text>
    <text x="750" y="460" text-anchor="middle" fill="#666d7b">零点在半径为 2 的路径外部</text>
  </g>
</svg>
