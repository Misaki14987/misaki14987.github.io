<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">右半平面和闭合边界</title>
  <desc id="desc">虚轴线段与右侧大半圆弧组成闭合边界 Gamma R，内部是要检查的右半平面区域。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2f5bd3"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fbfbfa"/>
  <path d="M360 55A160 160 0 0 1 360 375Z" fill="#e8efff"/>
  <g fill="none" stroke="#7b8190" stroke-width="1.5">
    <line x1="85" y1="215" x2="820" y2="215"/>
    <line x1="360" y1="30" x2="360" y2="400"/>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#20242d">
    <text x="814" y="200" text-anchor="end">σ = Re s</text>
    <text x="377" y="48">jω = Im s</text>
    <text x="218" y="246" text-anchor="middle" fill="#666d7b">左半平面</text>
    <text x="480" y="236" text-anchor="middle" font-weight="600">待检查的右半平面</text>
    <text x="480" y="261" text-anchor="middle" fill="#666d7b">Re s &gt; 0</text>
  </g>
  <line x1="360" y1="55" x2="360" y2="375" stroke="#2f5bd3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M360 375A160 160 0 0 0 360 55" fill="none" stroke="#28775f" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" font-size="17" fill="#20242d">
    <text x="340" y="112" text-anchor="end" font-weight="600">虚轴段</text>
    <text x="515" y="104" font-weight="600">右侧大半圆弧</text>
    <text x="505" y="191" font-weight="600">Γ<tspan baseline-shift="sub" font-size="12">R</tspan></text>
    <text x="440" y="205" text-anchor="middle" fill="#666d7b">R</text>
    <text x="520" y="301" font-weight="600">逆时针，R → ∞</text>
  </g>
  <line x1="360" y1="215" x2="520" y2="215" stroke="#9aa0ab" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="360" cy="55" r="5" fill="#20242d"/>
  <circle cx="360" cy="375" r="5" fill="#20242d"/>
</svg>
