<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
  <title id="title">同一有源 RC 频率响应的 Bode 图和奈奎斯特图</title><desc id="desc">增益为四的有源 RC 低通电路的幅频响应、相频响应和复平面轨迹，三个典型频率点使用相同标记。</desc><rect width="900" height="690" fill="#f8f7f2"/>
  <g font-family="sans-serif" fill="#172033" font-size="16"><text x="42" y="46">幅频响应</text><text x="42" y="280">相频响应</text><text x="510" y="46">奈奎斯特轨迹</text></g>
  <g fill="#fff" stroke="#a4a6aa"><rect x="82" y="62" width="365" height="175"/><rect x="82" y="296" width="365" height="175"/><rect x="510" y="62" width="340" height="409"/></g>
  <g stroke="#777c89" fill="none"><line x1="82" y1="95" x2="447" y2="95" stroke-dasharray="5 6"/><line x1="82" y1="135" x2="447" y2="135" stroke-dasharray="5 6"/><line x1="82" y1="360" x2="447" y2="360" stroke-dasharray="5 6"/><line x1="82" y1="438" x2="447" y2="438" stroke-dasharray="5 6"/><line x1="550" y1="82" x2="550" y2="451"/><line x1="530" y1="267" x2="830" y2="267"/></g>
  <g font-family="sans-serif" font-size="13" fill="#485064"><text x="70" y="100" text-anchor="end">12.04 dB</text><text x="70" y="140" text-anchor="end">9.03 dB</text><text x="70" y="365" text-anchor="end">−45°</text><text x="70" y="443" text-anchor="end">−90°</text><text x="445" y="258" text-anchor="end">log ω →</text><text x="445" y="492" text-anchor="end">log ω →</text><text x="830" y="258" text-anchor="end">Re →</text><text x="560" y="84">Im</text></g>
  <g fill="none" stroke-linecap="round"><path d="M82 96 C178 98 235 106 280 135 S360 200 447 226" stroke="#3156d8" stroke-width="3.5"/><path d="M82 312 C165 316 225 331 280 360 S373 424 447 438" stroke="#28775f" stroke-width="3.5"/><path d="M820 267 C820 342 760 402 685 402 C610 402 550 342 550 267" stroke="#3156d8" stroke-width="3.5"/></g>
  <line x1="280" y1="62" x2="280" y2="471" stroke="#a4a6aa" stroke-dasharray="4 5"/>
  <g font-family="sans-serif" font-size="13"><circle cx="145" cy="99" r="5" fill="#3156d8"/><circle cx="145" cy="319" r="5" fill="#3156d8"/><circle cx="817" cy="294" r="5" fill="#3156d8"/><circle cx="280" cy="135" r="5" fill="#d4535d"/><circle cx="280" cy="360" r="5" fill="#d4535d"/><circle cx="685" cy="402" r="5" fill="#d4535d"/><circle cx="405" cy="213" r="5" fill="#28775f"/><circle cx="405" cy="430" r="5" fill="#28775f"/><circle cx="553" cy="294" r="5" fill="#28775f"/><text x="150" y="88" fill="#3156d8">0.1ωₚ</text><text x="286" y="125" fill="#d4535d">ωₚ</text><text x="410" y="203" fill="#28775f">10ωₚ</text><text x="792" y="286" text-anchor="end" fill="#3156d8">3.96−j0.40</text><text x="695" y="424" fill="#d4535d">2−j2</text></g>
  <g font-family="sans-serif" fill="#172033" font-size="15"><text x="82" y="535">同一个频率点：</text><text x="82" y="570">Bode 图给出长度 |H(jω)| 和角度 ∠H(jω)</text><text x="82" y="605">奈奎斯特图把这个长度和角度合成复平面上的点</text></g>
  <g transform="translate(590 560)"><circle r="4" fill="#172033"/><line x2="110" y2="-70" stroke="#d4535d" stroke-width="3"/><path d="M42 0 A42 42 0 0 0 35 -23" fill="none" stroke="#28775f" stroke-width="2"/><text x="52" y="-7" fill="#28775f" font-family="sans-serif" font-size="14">∠H</text><text x="64" y="-48" fill="#d4535d" font-family="sans-serif" font-size="14">|H|</text><line x2="140" stroke="#777c89"/></g>
</svg>
