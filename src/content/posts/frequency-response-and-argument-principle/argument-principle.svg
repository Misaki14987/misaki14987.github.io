<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">幅角原理中的路径映射</title><desc id="desc">输入平面的逆时针闭合路径包围两个零点和一个极点，映射轨迹绕输出平面原点一圈。</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3156d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#28775f"/></marker></defs>
  <rect width="900" height="420" fill="#f8f7f2"/><g fill="#fff" stroke="#a4a6aa"><rect x="40" y="45" width="330" height="310"/><rect x="530" y="45" width="330" height="310"/></g><g stroke="#777c89"><line x1="62" y1="200" x2="348" y2="200"/><line x1="205" y1="66" x2="205" y2="334"/><line x1="552" y1="200" x2="838" y2="200"/><line x1="695" y1="66" x2="695" y2="334"/></g>
  <g font-family="sans-serif" font-size="15" fill="#172033"><text x="55" y="70">s 平面</text><text x="545" y="70">F(s) 平面</text><text x="345" y="194" text-anchor="end" fill="#485064">Re</text><text x="211" y="80" fill="#485064">Im</text><text x="835" y="194" text-anchor="end" fill="#485064">Re</text><text x="701" y="80" fill="#485064">Im</text></g>
  <path d="M318 202 C318 125 275 91 213 92 C145 93 102 133 100 202 C98 268 130 305 190 315 C258 326 312 283 318 202" fill="none" stroke="#3156d8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <g fill="none" stroke="#3156d8" stroke-width="3"><circle cx="164" cy="148" r="6"/><circle cx="254" cy="236" r="6"/></g><path d="M210 245l14 14M224 245l-14 14" stroke="#d4535d" stroke-width="3"/>
  <g font-family="sans-serif" font-size="14"><text x="146" y="132" fill="#3156d8">零点 z₁</text><text x="263" y="226" fill="#3156d8">零点 z₂</text><text x="195" y="278" fill="#d4535d">极点 p₁</text><text x="127" y="326" fill="#3156d8">输入路径 Γ：逆时针</text></g>
  <g transform="translate(430 185)" fill="#172033" font-family="sans-serif"><text text-anchor="middle" font-size="20">F(s)</text><path d="M-34 18H34" stroke="#172033" stroke-width="2" marker-end="url(#arrow-green)"/></g>
  <path d="M761 201 C768 139 735 105 687 112 C630 120 607 172 619 222 C631 274 679 300 727 278 C770 258 782 221 761 201" fill="none" stroke="#28775f" stroke-width="3" marker-end="url(#arrow-green)"/><circle cx="695" cy="200" r="6" fill="#d4535d"/><g font-family="sans-serif" font-size="14"><text x="706" y="190" fill="#d4535d">原点</text><text x="617" y="326" fill="#28775f">映射轨迹净绕原点一圈</text><text x="620" y="348" fill="#172033">Z−P=2−1=1</text></g>
</svg>
