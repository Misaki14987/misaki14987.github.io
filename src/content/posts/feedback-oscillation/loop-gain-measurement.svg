<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 900 290" role="img" aria-labelledby="title desc">
  <title id="title">断环后的环路增益测量</title>
  <desc id="desc">测试信号 vt 从断口进入求和点，经过放大器 A 和反馈网络 beta 后返回 vr。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#172033"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3156d8"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#f8f7f2"/>
  <line x1="54" y1="142" x2="162" y2="142" stroke="#3156d8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="90" y="126" fill="#3156d8" font-family="sans-serif" font-size="19" font-weight="700">v<tspan baseline-shift="sub" font-size="13">t</tspan></text>

  <circle cx="190" cy="142" r="27" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="190" y="149" text-anchor="middle" fill="#172033" font-family="sans-serif" font-size="21" font-weight="700">Σ</text>
  <text x="171" y="112" fill="#d4535d" font-family="sans-serif" font-size="22" font-weight="700">−</text>
  <text x="183" y="190" fill="#d4535d" font-family="sans-serif" font-size="16">e = −v<tspan baseline-shift="sub" font-size="11">t</tspan></text>

  <line x1="217" y1="142" x2="310" y2="142" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="312" y="105" width="150" height="74" rx="4" fill="#e7ebfb" stroke="#3156d8" stroke-width="2"/>
  <text x="387" y="137" text-anchor="middle" fill="#172033" font-family="sans-serif" font-size="21" font-weight="700">A(jω)</text>
  <text x="387" y="160" text-anchor="middle" fill="#485064" font-family="sans-serif" font-size="14">放大器</text>

  <line x1="462" y1="142" x2="650" y2="142" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="650" cy="142" r="5" fill="#172033"/>
  <text x="555" y="124" text-anchor="middle" fill="#485064" font-family="sans-serif" font-size="17">out = −Av<tspan baseline-shift="sub" font-size="12">t</tspan></text>

  <path d="M650 142V250H550" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="398" y="213" width="150" height="74" rx="4" fill="#e3eee8" stroke="#28775f" stroke-width="2"/>
  <text x="473" y="245" text-anchor="middle" fill="#172033" font-family="sans-serif" font-size="21" font-weight="700">β(jω)</text>
  <text x="473" y="268" text-anchor="middle" fill="#485064" font-family="sans-serif" font-size="14">反馈网络</text>
  <line x1="398" y1="250" x2="238" y2="250" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="299" y="232" text-anchor="middle" fill="#28775f" font-family="sans-serif" font-size="18" font-weight="700">v<tspan baseline-shift="sub" font-size="12">r</tspan> = −Aβv<tspan baseline-shift="sub" font-size="12">t</tspan></text>

  <line x1="211" y1="225" x2="211" y2="276" stroke="#d4535d" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M200 235l20 16m-20 0 20-16" stroke="#d4535d" stroke-width="2" fill="none"/>
  <text x="211" y="304" text-anchor="middle" fill="#d4535d" font-family="sans-serif" font-size="15">概念上的断口</text>

  <rect x="625" y="228" width="220" height="74" rx="4" fill="#fff" stroke="#172033" stroke-width="1.5"/>
  <text x="735" y="258" text-anchor="middle" fill="#172033" font-family="sans-serif" font-size="17">T(jω) = v<tspan baseline-shift="sub" font-size="12">r</tspan> / v<tspan baseline-shift="sub" font-size="12">t</tspan></text>
  <text x="735" y="286" text-anchor="middle" fill="#d4535d" font-family="sans-serif" font-size="22" font-weight="700">= −A(jω)β(jω)</text>
</svg>
