<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 900 360" role="img" aria-labelledby="title desc">
  <title id="title">RC 极点产生的相位滞后</title>
  <desc id="desc">RC 低通电路在极点频率下产生 45 度相位滞后，高频时逐渐逼近 90 度。</desc>
  <rect width="900" height="430" fill="#f8f7f2"/>
  <text x="62" y="112" fill="#3156d8" font-family="sans-serif" font-size="18" font-weight="700">v<tspan baseline-shift="sub" font-size="12">in</tspan></text>
  <line x1="108" y1="106" x2="168" y2="106" stroke="#172033" stroke-width="3"/>
  <path d="M168 106h18l10-16 18 32 18-32 18 32 18-32 10 16h22" fill="none" stroke="#172033" stroke-width="3" stroke-linejoin="round"/>
  <text x="231" y="76" text-anchor="middle" fill="#172033" font-family="sans-serif" font-size="19" font-weight="700">R</text>
  <line x1="300" y1="106" x2="376" y2="106" stroke="#172033" stroke-width="3"/>
  <circle cx="330" cy="106" r="5" fill="#172033"/>
  <text x="337" y="88" fill="#28775f" font-family="sans-serif" font-size="18" font-weight="700">v<tspan baseline-shift="sub" font-size="12">out</tspan></text>
  <line x1="330" y1="106" x2="330" y2="176" stroke="#172033" stroke-width="3"/>
  <line x1="300" y1="176" x2="360" y2="176" stroke="#172033" stroke-width="3"/>
  <line x1="300" y1="195" x2="360" y2="195" stroke="#172033" stroke-width="3"/>
  <line x1="330" y1="195" x2="330" y2="247" stroke="#172033" stroke-width="3"/>
  <path d="M298 247h64m-52 13h40m-28 13h16" stroke="#172033" stroke-width="3"/>
  <text x="380" y="192" fill="#172033" font-family="sans-serif" font-size="19" font-weight="700">C</text>
  <text x="220" y="324" text-anchor="middle" fill="#485064" font-family="sans-serif" font-size="17">ω<tspan baseline-shift="sub" font-size="12">0</tspan> = 1 / RC</text>

  <rect x="454" y="76" width="382" height="278" fill="#fff" stroke="#a4a6aa"/>
  <line x1="492" y1="318" x2="808" y2="318" stroke="#172033" stroke-width="2"/>
  <line x1="492" y1="318" x2="492" y2="104" stroke="#172033" stroke-width="2"/>
  <text x="470" y="94" text-anchor="middle" fill="#172033" font-family="sans-serif" font-size="16">φ<tspan baseline-shift="sub" font-size="11">H</tspan></text>
  <text x="482" y="323" text-anchor="end" fill="#485064" font-family="sans-serif" font-size="14">0°</text>
  <text x="482" y="216" text-anchor="end" fill="#485064" font-family="sans-serif" font-size="14">45°</text>
  <text x="482" y="114" text-anchor="end" fill="#485064" font-family="sans-serif" font-size="14">90°</text>
  <line x1="492" y1="211" x2="808" y2="211" stroke="#777c89" stroke-width="1" stroke-dasharray="5 6"/>
  <line x1="650" y1="318" x2="650" y2="211" stroke="#3156d8" stroke-width="1.5" stroke-dasharray="5 6"/>
  <path d="M492 314 C555 310 610 278 650 211 S744 120 808 112" fill="none" stroke="#3156d8" stroke-width="4"/>
  <circle cx="650" cy="211" r="6" fill="#3156d8"/>
  <text x="666" y="198" fill="#3156d8" font-family="sans-serif" font-size="16" font-weight="700">(ω<tspan baseline-shift="sub" font-size="11">0</tspan>, 45°)</text>
  <text x="650" y="340" text-anchor="middle" fill="#3156d8" font-family="sans-serif" font-size="15">ω<tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <text x="810" y="340" text-anchor="end" fill="#485064" font-family="sans-serif" font-size="15">log ω →</text>
  <text x="646" y="394" text-anchor="middle" fill="#485064" font-family="sans-serif" font-size="16">频率越高，相位滞后越接近 90°</text>
</svg>
