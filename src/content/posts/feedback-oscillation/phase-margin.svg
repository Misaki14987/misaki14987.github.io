<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 54 900 450" role="img" aria-labelledby="title desc">
  <title id="title">相位裕度的 Bode 图读法</title>
  <desc id="desc">在环路增益幅度等于 1 的增益交越频率下，累计相位为 300 度，距离 360 度还有 60 度相位裕度。</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#e94f37"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fffdf2"/>
  <rect x="92" y="66" width="720" height="158" fill="#fff" stroke="#a49d89"/>
  <text x="52" y="92" fill="#18160f" font-family="sans-serif" font-size="17" font-weight="700">|T|</text>
  <line x1="92" y1="166" x2="812" y2="166" stroke="#78725f" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="80" y="171" text-anchor="end" fill="#4b4736" font-family="sans-serif" font-size="14">1 (0 dB)</text>
  <path d="M92 100 C260 102 374 115 520 166 S700 210 812 216" fill="none" stroke="#086b52" stroke-width="4"/>
  <circle cx="520" cy="166" r="6" fill="#086b52"/>
  <text x="535" y="147" fill="#086b52" font-family="sans-serif" font-size="16" font-weight="700">|T(jω<tspan baseline-shift="sub" font-size="11">gc</tspan>)| = 1</text>

  <rect x="92" y="270" width="720" height="176" fill="#fff" stroke="#a49d89"/>
  <text x="43" y="296" fill="#18160f" font-family="sans-serif" font-size="17" font-weight="700">∠T</text>
  <line x1="92" y1="306" x2="812" y2="306" stroke="#e94f37" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="80" y="311" text-anchor="end" fill="#e94f37" font-family="sans-serif" font-size="14">360°</text>
  <line x1="92" y1="412" x2="812" y2="412" stroke="#78725f" stroke-width="1" stroke-dasharray="5 7"/>
  <text x="80" y="417" text-anchor="end" fill="#4b4736" font-family="sans-serif" font-size="14">180°</text>
  <path d="M92 410 C270 406 375 385 520 346 S700 314 812 302" fill="none" stroke="#8a6a10" stroke-width="4"/>
  <circle cx="520" cy="346" r="6" fill="#8a6a10"/>
  <text x="535" y="370" fill="#8a6a10" font-family="sans-serif" font-size="16" font-weight="700">∠T(ω<tspan baseline-shift="sub" font-size="11">gc</tspan>) = 300°</text>

  <line x1="520" y1="66" x2="520" y2="470" stroke="#086b52" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="520" y="492" text-anchor="middle" fill="#086b52" font-family="sans-serif" font-size="16" font-weight="700">ω<tspan baseline-shift="sub" font-size="11">gc</tspan></text>
  <text x="812" y="492" text-anchor="end" fill="#4b4736" font-family="sans-serif" font-size="15">log ω →</text>

  <line x1="555" y1="342" x2="555" y2="310" stroke="#e94f37" stroke-width="3" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="573" y="331" fill="#e94f37" font-family="sans-serif" font-size="17" font-weight="700">PM = 60°</text>
</svg>
